[project]
name = "crypto-vc-investment-database"
version = "1.0.0"
description = "Reproduceerbare database van publiek bekende investeringen van twintig crypto-venture-capitalfondsen"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
